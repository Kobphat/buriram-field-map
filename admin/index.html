/* Layout: sign-in gate → (admin) field-office console: status strip, district progress against quota, tabs; (enumerator) own account and sent codes */
main.wrap{display:grid;gap:18px;padding-top:24px}

.gate h1{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.3rem);color:var(--brown)}

.gate li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:.95rem}
.gate li b.k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-size:.85rem}
@media (max-width:820px){.gate{grid-template-columns:1fr;padding:12px 0}}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}

.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--f-mono);font-size:1.7rem;font-weight:500;line-height:1.2}
.stat span{font-size:.84rem;color:var(--muted)}
.stat .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}.stat .bar i{display:block;height:100%;background:var(--ink)}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}
.dists{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.dists{grid-template-columns:1fr 1fr}}@media (max-width:520px){.dists{grid-template-columns:1fr}}
.dist{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:8px}
.dist .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell{display:grid;gap:3px;font-size:.74rem;color:var(--muted)}
.cell .m{height:34px;border-radius:8px;background:var(--sunk);position:relative;overflow:hidden}
.cell .m i{position:absolute;inset:auto 0 0 0;background:var(--mg);opacity:.85}
.cell.o .m i{background:var(--nk)}
.cell .v{font-family:var(--f-mono);color:var(--ink);font-size:.78rem}
.cell.full .v{color:var(--mint-ink);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;border:0;background:none;font:inherit;padding:10px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.panel{display:grid;gap:12px}.panel[hidden]{display:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input:not([type=checkbox]),.tools select{font:inherit;border:1px solid var(--line2);border-radius:10px;padding:7px 10px;min-height:40px;background:var(--surface);color:var(--ink)}
.tscroll{max-height:70vh}
.tscroll th{position:sticky;top:0;z-index:1}
td,th{white-space:nowrap;padding:8px 12px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--mint-soft)}
.flag{color:var(--warn);font-weight:600}
.prog{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--sunk);vertical-align:middle;margin-left:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.danger-zone{border:1px solid #e6b7b9;background:#fdf3f3;border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.form-row{display:grid;grid-template-columns:1fr 1.3fr 1fr .8fr auto;gap:10px;align-items:end}

dialog{border:0;border-radius:18px;padding:0;max-width:min(720px,94vw);width:100%;box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}

      $("#cb").innerHTML = L.length ? L.map(function (c) { var p = c.phone, m = p.length > 4 ? p.slice(0, 3) + "-xxx-" + p.slice(-4) : p; return '<tr><td class="num">' + esc(c.code) + '</td><td>' + esc(c.d) + '</td><td>' + esc(c.code[0]) + '</td><td class="r num">' + esc(c.I) + '</td><td class="r num">' + esc(c.P) + '</td><td class="r num">' + esc(c.C) + '</td><td><button class="btn sm num" data-full="' + esc(p) + '">' + esc(m) + '</button></td><td>' + esc(c.time) + '</td><td class="num">' + esc(c.deleteBy) + '</td></tr>'; }).join("") : '<tr><td colspan="9" class="empty">ยังไม่มีผู้ให้เบอร์</td></tr>'; };
    drawC(); $("#srt").onchange = drawC; $("#cb").onclick = function (e) { var b = e.target.closest("button[data-full]"); if (b) b.textContent = b.dataset.full; };
  }
  function renderUsers() {
    var P = $("#pu");
    if (!USERS) { P.innerHTML = '<p class="empty">กำลังโหลดบัญชี…</p>'; api("users").then(function (j) { if (!j.ok) return fail(j); USERS = j.users; renderUsers(); }); return; }
    var me = Auth.get().user.username;
    P.innerHTML = '<div class="card" style="display:grid;gap:10px"><h3>เพิ่มบัญชี</h3><form class="form-row" id="add" autocomplete="off">' +
      '<label>ชื่อผู้ใช้ (a–z 0–9 . _ -)<input class="txt" name="username" required pattern="[a-z0-9._\\-]{3,20}" autocapitalize="none" spellcheck="false"></label>' +
      '<label>ชื่อที่แสดง<input class="txt" name="name" placeholder="เช่น ผู้ช่วยวิจัย 3"></label>' +
      '<label>สิทธิ์<select name="role"><option value="enumerator">ผู้เก็บข้อมูล</option><option value="admin">ผู้ดูแล (ดูข้อมูลได้)</option></select></label>' +
      '<label>เลขผู้เก็บ<select name="enumerator"><option value="">ไม่มี</option>' + [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) { return '<option>' + n + '</option>'; }).join("") + '</select></label>' +
      '<button class="btn primary">สร้างบัญชี</button></form><p class="small muted">ระบบสร้างรหัสผ่านชั่วคราวให้ แสดงครั้งเดียว ส่งให้เจ้าของบัญชีทางช่องทางส่วนตัว เจ้าของบัญชีต้องตั้งรหัสใหม่ตอนเข้าครั้งแรก ผู้ดูแลที่จะเก็บข้อมูลด้วยให้กำหนดเลขผู้เก็บไว้ด้วย</p></div>' +
      '<div class="tscroll"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>สิทธิ์</th><th>เลขผู้เก็บ</th><th>สถานะ</th><th>เข้าล่าสุด</th><th></th></tr></thead><tbody>' +
      USERS.map(function (u) { return '<tr data-u="' + esc(u.username) + '"><td class="num">' + esc(u.username) + (u.username === me ? ' <span class="chip">คุณ</span>' : '') + '</td><td>' + esc(u.name) + '</td><td>' + (u.role === "admin" ? "ผู้ดูแล" : "ผู้เก็บข้อมูล") + '</td>' +
        '<td><select data-k="enumerator" aria-label="เลขผู้เก็บ">' + ['<option value="0">-</option>'].concat([1, 2, 3, 4, 5, 6, 7, 8].map(function (n) { return '<option value="' + n + '"' + (u.enumerator === n ? " selected" : "") + '>' + n + '</option>'; })).join("") + '</select></td>' +
        '<td class="' + (u.active ? "st-on" : "st-off") + '">' + (u.active ? "ใช้งาน" : "ปิด") + (u.mustChange ? ' <span class="chip warn">รอตั้งรหัส</span>' : '') + '</td><td class="num small">' + esc((u.lastLogin || "-").replace("T", " ").slice(0, 16)) + '</td>' +
        '<td><button class="btn sm" data-a="reset">ตั้งรหัสชั่วคราว</button> ' + (u.username === me ? '' : '<button class="btn sm" data-a="toggle">' + (u.active ? "ปิดบัญชี" : "เปิดบัญชี") + '</button>') + '</td></tr>'; }).join("") + '</tbody></table></div>';
    var showTemp = function (j, what) { dialog(what, '<p>ชื่อผู้ใช้ <b class="num">' + esc(j.username) + '</b></p><div class="temp" id="tp">' + esc(j.tempPassword) + '</div><p class="small muted">รหัสนี้แสดงครั้งเดียว ส่งให้เจ้าของบัญชีทางช่องทางส่วนตัว ไม่ต้องเก็บไว้ที่อื่น เจ้าของบัญชีจะถูกให้ตั้งรหัสใหม่ตอนเข้าครั้งแรก</p><div><button class="btn" id="cp">คัดลอก</button></div>');
      $("#cp").onclick = function () { try { navigator.clipboard.writeText(j.tempPassword); this.textContent = "คัดลอกแล้ว"; } catch (x) {} }; };
    $("#add").onsubmit = function (e) { e.preventDefault(); var f = e.target;
      api("addUser", { username: f.username.value.trim().toLowerCase(), name: f.name.value.trim(), role: f.role.value, enumerator: +f.enumerator.value || 0 }).then(function (j) { if (!j.ok) return fail(j); msg(""); USERS = null; renderUsers(); showTemp(j, "สร้างบัญชีแล้ว"); }); };
    P.querySelector("tbody").onclick = function (e) { var b = e.target.closest("button[data-a]"); if (!b) return; var name = b.closest("tr").dataset.u, u = USERS.filter(function (x) { return x.username === name; })[0];
      if (b.dataset.a === "reset") { if (!confirm("ตั้งรหัสผ่านชั่วคราวใหม่ให้ " + name + "? รหัสเดิมใช้ไม่ได้ทันที")) return; api("resetPassword", { username: name }).then(function (j) { if (!j.ok) return fail(j); USERS = null; renderUsers(); showTemp(j, "รหัสผ่านชั่วคราวใหม่"); }); }
      if (b.dataset.a === "toggle") api("setUser", { username: name, active: !u.active }).then(function (j) { if (!j.ok) return fail(j); msg((u.active ? "ปิด" : "เปิด") + "บัญชี " + name + " แล้ว"); USERS = null; renderUsers(); }); };
    P.querySelector("tbody").onchange = function (e) { var s = e.target.closest("select[data-k]"); if (!s) return; var name = s.closest("tr").dataset.u;
      api("setUser", { username: name, enumerator: +s.value || 0 }).then(function (j) { if (!j.ok) { fail(j); USERS = null; return renderUsers(); } msg("เปลี่ยนเลขผู้เก็บของ " + name + " แล้ว"); USERS = null; renderUsers(); }); };
  }
  function renderExport() {
    $("#px").innerHTML = '<div class="card" style="display:grid;gap:12px"><h3>ดาวน์โหลดชุดข้อมูล</h3><p class="small muted">ไฟล์ CSV (UTF-8 เปิดด้วย Excel, Stata, R ได้) หนึ่งแถวต่อผู้ตอบ ใช้รหัสผู้ตอบเป็นตัวระบุ ไม่มีชื่อ ไม่มีเบอร์โทร ทุกครั้งที่ดาวน์โหลดถูกบันทึกในชีต “บันทึกระบบ”</p>' +
      '<label class="small"><input type="checkbox" id="xt"> รวมข้อมูลทดสอบ</label><div class="tools"><button class="btn primary" data-w="responses">คำตอบทั้งหมด (responses.csv)</button><button class="btn" data-w="conjoint">การเลือกคู่ผู้สมัคร (conjoint.csv)</button></div>' +
      '<p class="small muted">คอลัมน์: code, rid (เลขอ้างอิงฟอร์ม), collector, received, test, flag, started, finished, seconds, mode, venue, enumerator, version, order, q1 … q76, ipc_I, ipc_P, ipc_C</p></div>';
    $("#px").onclick = function (e) { var b = e.target.closest("button[data-w]"); if (!b) return;
      if (demo()) return msg("โหมดตัวอย่าง: ดาวน์โหลดได้เมื่อเชื่อมหลังบ้านแล้ว", true);
      b.disabled = true; api("exportCsv", { which: b.dataset.w, includeTest: $("#xt").checked }).then(function (j) { b.disabled = false; if (!j.ok) return fail(j);
        var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([j.csv], { type: "text/csv;charset=utf-8" })); a.download = j.name; a.click(); msg("ดาวน์โหลด " + j.rows + " แถว"); }); };
  }
  function renderSettings() {
    $("#ps").innerHTML = '<div class="card" style="display:grid;gap:8px"><h3>ข้อมูลทดสอบ</h3><p class="small muted">ใช้ทดสอบระบบก่อน EC อนุมัติ ทุกแถวมีค่า test = 1 และลบออกได้ทั้งหมด</p><div class="tools"><button class="btn" id="seed">สร้างข้อมูลทดสอบ 30 ชุด</button><button class="btn" id="clr">ลบข้อมูลทดสอบทั้งหมด</button></div></div>' +
      '<div class="danger-zone"><h3>ลบเบอร์ติดต่อทั้งหมด</h3><p class="small">ทำเมื่อสัมภาษณ์รอบ 2 เสร็จ ตามที่แจ้งคณะกรรมการจริยธรรมฯ' + (D.deleteBy ? ' (กำหนดภายใน ' + esc(D.deleteBy) + ')' : '') + ' ลบแล้วกู้คืนไม่ได้ พิมพ์ <b>ลบเบอร์ทั้งหมด</b> เพื่อยืนยัน</p><div class="tools"><input id="cf" placeholder="ลบเบอร์ทั้งหมด" aria-label="ข้อความยืนยัน"><button class="btn" id="del" disabled style="color:var(--bad)">ลบเบอร์ ' + D.contacts + ' รายการ</button></div></div>' +
      '<p class="small muted">การเปิดรับข้อมูลจริง: เจ้าของสคริปต์ตั้งค่า ACCEPT = 1 ใน Script properties หลัง EC อนุมัติ</p>';
    $("#seed").onclick = function () { msg("กำลังสร้างข้อมูลทดสอบ…"); api("seedTest", { n: 30 }).then(function (j) { if (!j.ok) return fail(j); msg("สร้างแล้ว " + j.made + " ชุด"); loadAdmin(); }); };
    $("#clr").onclick = function () { msg("กำลังลบข้อมูลทดสอบ…"); api("clearTest").then(function (j) { if (!j.ok) return fail(j); msg("ลบแล้ว " + j.deleted + " ชุด"); loadAdmin(); }); };
    $("#cf").oninput = function () { $("#del").disabled = $("#cf").value !== "ลบเบอร์ทั้งหมด"; };
    $("#del").onclick = function () { api("deleteContacts", { confirm: $("#cf").value }).then(function (j) { if (!j.ok) return fail(j); msg("ลบเบอร์แล้ว " + j.deleted + " รายการ"); CONTACTS = null; loadAdmin(); }); };
  }
  start();
})();
</script>
